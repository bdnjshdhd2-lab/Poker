<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker Night Leaderboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{--bg:#f3efe2;--card:#fffdf6;--ink:#1b2a22;--mute:#5d6b62;--line:#d9d3bd;--gold:#8a6a12;--pos:#1f6b3f;--neg:#a63a2b;--chip:#1f4d3a;--chipink:#f3efe2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f211a;--card:#173126;--ink:#f1ecdb;--mute:#a8b8ad;--line:#2b4a3b;--gold:#e0bb62;--pos:#7fd39b;--neg:#f0a08f;--chip:#e0bb62;--chipink:#0f211a}}
:root[data-theme="dark"]{--bg:#0f211a;--card:#173126;--ink:#f1ecdb;--mute:#a8b8ad;--line:#2b4a3b;--gold:#e0bb62;--pos:#7fd39b;--neg:#f0a08f;--chip:#e0bb62;--chipink:#0f211a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1,h2{font-family:Fraunces,Georgia,"Times New Roman",serif;margin:0}
h1{font-size:clamp(2rem,7vw,3rem);font-weight:800;line-height:1.05;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:600;margin:40px 0 12px}
.sub{color:var(--mute);margin:8px 0 0}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:22px 0 0}
.stats b{font-family:Fraunces,Georgia,serif;font-size:1.6rem;font-weight:800;display:block;line-height:1.1}
.stats span{color:var(--mute);font-size:.9rem}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:12px 14px;text-align:right;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{font-weight:600;font-size:.85rem;color:var(--mute);border-bottom:1px solid var(--line)}
tbody tr+tr td{border-top:1px solid var(--line)}
td:nth-child(2){font-weight:600}
.chip{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px dashed var(--chipink);outline:2px solid var(--chip);background:var(--chip);color:var(--chipink);font-weight:700;font-size:.9rem}
.chip.rest{background:transparent;color:var(--mute);border:0;outline:0;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.gold{color:var(--gold);font-weight:700}
.night{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.night h3{margin:0;font-size:1.05rem}
.night p{margin:2px 0 10px;color:var(--mute);font-size:.92rem}
.night ol{margin:0;padding-left:1.4em}
.night li+li{margin-top:2px}
.empty{color:var(--mute);padding:18px}
footer{margin-top:36px;color:var(--mute);font-size:.88rem}
</style>
</head>
<body>
<main>
  <h1>Poker night leaderboard</h1>
  <p class="sub">Winner takes all. Buy-in 100 CZK.</p>
  <div class="stats" id="stats"></div>

  <h2>Standings</h2>
  <div class="wrap">
    <table>
      <thead><tr><th>#</th><th>Player</th><th>Wins</th><th>Played</th><th>Won</th><th>Net</th></tr></thead>
      <tbody id="board"></tbody>
    </table>
  </div>

  <h2>Tournaments</h2>
  <div id="log"></div>

  <footer>Net = money won minus buy-ins. Tied placings are listed together.</footer>
</main>
<script>
// Add new tournaments to this list. Each placing is a list of names (several names = shared place).
var TOURNAMENTS = [
  { date: "2026-10-03", buyin: 100, results: [["Ríša"], ["Zdena"], ["Kuba", "David"]] }
];

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function czk(n){return n.toLocaleString("en-GB")+" CZK"}

var stats = {};
var totalPot = 0;
TOURNAMENTS.forEach(function(t){
  var players = [].concat.apply([], t.results);
  var pot = players.length * t.buyin;
  totalPot += pot;
  t.pot = pot;
  players.forEach(function(p){
    var s = stats[p] || (stats[p] = {name:p, played:0, wins:0, won:0, spent:0});
    s.played++; s.spent += t.buyin;
  });
  var winners = t.results[0];
  winners.forEach(function(p){ stats[p].wins++; stats[p].won += pot / winners.length; });
});

var rows = Object.keys(stats).map(function(k){var s=stats[k]; s.net=s.won-s.spent; return s});
rows.sort(function(a,b){return b.wins-a.wins || b.net-a.net || a.name.localeCompare(b.name)});

var rank = 0, html = "";
rows.forEach(function(s,i){
  if (i===0 || s.wins!==rows[i-1].wins || s.net!==rows[i-1].net) rank = i+1;
  var net = (s.net>0?"+":s.net<0?"\u2212":"") + czk(Math.abs(s.net));
  html += "<tr><td><span class='chip"+(rank>1?" rest":"")+"'>"+rank+"</span></td>"+
    "<td>"+esc(s.name)+"</td><td"+(s.wins?" class='gold'":"")+">"+s.wins+"</td><td>"+s.played+"</td>"+
    "<td>"+czk(s.won)+"</td><td class='"+(s.net>0?"pos":s.net<0?"neg":"")+"'>"+net+"</td></tr>";
});
document.getElementById("board").innerHTML = html || "<tr><td class='empty' colspan='6'>No tournaments yet.</td></tr>";

document.getElementById("stats").innerHTML =
  "<div><b>"+TOURNAMENTS.length+"</b><span>tournaments</span></div>"+
  "<div><b>"+rows.length+"</b><span>players</span></div>"+
  "<div><b>"+czk(totalPot)+"</b><span>played for</span></div>";

var places = ["1st","2nd","3rd"];
var log = "";
TOURNAMENTS.slice().sort(function(a,b){return a.date<b.date?1:-1}).forEach(function(t){
  var d = new Date(t.date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  var n = [].concat.apply([], t.results).length;
  log += "<div class='night'><h3>"+esc(d)+"</h3><p>"+n+" players, pot "+czk(t.pot)+"</p><ol>";
  var pos = 1;
  t.results.forEach(function(g){
    log += "<li value='"+pos+"'>"+g.map(esc).join(" &amp; ")+(pos===1?" <span class='gold'>won "+czk(t.pot/g.length)+(g.length>1?" each":"")+"</span>":"")+"</li>";
    pos += g.length;
  });
  log += "</ol></div>";
});
document.getElementById("log").innerHTML = log || "<p class='empty'>No tournaments yet.</p>";
</script>
</body>
</html>
