<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker – žebříček</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
:root{--bg:#f3efe2;--card:#fffdf6;--ink:#1b2a22;--mute:#5d6b62;--line:#d9d3bd;--gold:#8a6a12;--pos:#1f6b3f;--neg:#a63a2b;--chip:#1f4d3a;--chipink:#f3efe2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f211a;--card:#173126;--ink:#f1ecdb;--mute:#a8b8ad;--line:#2b4a3b;--gold:#e0bb62;--pos:#7fd39b;--neg:#f0a08f;--chip:#e0bb62;--chipink:#0f211a}}
:root[data-theme="dark"]{--bg:#0f211a;--card:#173126;--ink:#f1ecdb;--mute:#a8b8ad;--line:#2b4a3b;--gold:#e0bb62;--pos:#7fd39b;--neg:#f0a08f;--chip:#e0bb62;--chipink:#0f211a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,.serif{font-family:Fraunces,Georgia,"Times New Roman",serif}
h1{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;line-height:1.1;margin:0}
h2{font-size:1.3rem;font-weight:600;margin:32px 0 12px}
#splash{position:fixed;inset:0;z-index:9;width:100%;border:0;background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-content:center;gap:14px;text-align:center;font:inherit}
#splash{transition:opacity .7s ease,transform .7s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
#splash .suits{font-size:1.8rem;letter-spacing:.5em;color:var(--gold)}
#splash .big{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(4rem,22vw,9rem);line-height:1}
#splash .hint{color:var(--mute);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#splash .hint{animation:none}}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;max-width:760px;margin:0 auto;padding:16px 16px 0}
.brand{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.2rem;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--mute);font-weight:600}
nav a.on{background:var(--chip);color:var(--chipink)}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
.sub{color:var(--mute);margin:6px 0 0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:36px 0 8px}
.slot{flex:1;max-width:200px;text-align:center;text-decoration:none;display:block}
.pn{font-weight:700;overflow-wrap:anywhere}
.pm{color:var(--mute);font-size:.88rem;margin-bottom:6px}
.blk{display:grid;place-items:center;border-radius:10px 10px 0 0;background:var(--card);border:1px solid var(--line);border-bottom:0;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:2.2rem}
.s1 .blk{height:160px;background:var(--chip);color:var(--chipink);font-size:3rem}
.s2 .blk{height:115px}.s3 .blk{height:85px}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:28px 0 0;justify-content:center}
.stats b,.grid b{font-family:Fraunces,Georgia,serif;font-size:1.5rem;font-weight:800;display:block;line-height:1.15}
.stats span,.grid span{color:var(--mute);font-size:.9rem}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{padding:12px 14px;text-align:right;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{font-weight:600;font-size:.85rem;color:var(--mute);border-bottom:1px solid var(--line)}
tbody tr+tr td{border-top:1px solid var(--line)}
td a{font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.gold{color:var(--gold);font-weight:700}
.night{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:10px;text-decoration:none}
.night b{display:block}.night span{color:var(--mute);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.grid div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.back{display:inline-block;margin-bottom:14px;color:var(--mute)}
.shot{margin:20px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.shot img{display:block;width:100%;height:auto}
.shot.noimg{display:grid;place-items:center;min-height:200px;color:var(--mute);border-style:dashed}
.shot.noimg::before{content:"Sem přijde obrázek hry"}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.res.first{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.res h3{display:flex;align-items:center;gap:12px;margin:0 0 10px;font-family:Fraunces,Georgia,serif;font-size:1.25rem}
.rk{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--chip);color:var(--chipink);font-weight:800;font-size:1rem;flex:none}
.picks{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px}
.picks li{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.92rem}
.res p{margin:0;color:var(--mute)}
.final{margin:0;padding-left:1.4em}
.rules{margin-top:20px}
.rules .final li{padding:5px 0}
.final li{padding:2px 0}
.thanks{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:12px 0 0}
.thanks li{background:var(--chip);color:var(--chipink);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.92rem}
.empty{color:var(--mute);padding:18px}
footer{margin-top:32px;color:var(--mute);font-size:.88rem}
</style>
</head>
<body>
<button id="splash" type="button"><span class="suits" aria-hidden="true">♠ ♥ ♦ ♣</span><span class="big">Poker</span><span class="hint">Klikni pro pokračování</span></button>
<header>
  <a class="brand" href="#/">♠ Poker</a>
  <nav><a href="#/" id="n-home">Přehled</a><a href="#/turnaje" id="n-tur">Turnaje</a><a href="#/zebricek" id="n-zeb">Žebříček</a><a href="#/3x3" id="n-3x3">3x3</a></nav>
</header>
<main id="app"></main>
<script>
// Nový turnaj přidej na konec tohoto seznamu. Každé umístění je seznam jmen (více jmen = sdílené místo).
var TOURNAMENTS = [
  { date: "2026-10-03", buyin: 100, results: [["Ríša"], ["Zdena"], ["Kuba", "David"]] }
];

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function kc(n){return n.toLocaleString("cs-CZ")+"\u00a0Kč"}
function sg(n){return (n>0?"+":n<0?"\u2212":"")+kc(Math.abs(n))}
function cl(n){return n>0?"pos":n<0?"neg":""}
function pl(n,a,b,c){return n+"\u00a0"+(n===1?a:(n>=2&&n<=4)?b:c)}
function dt(d){return new Date(d+"T12:00:00").toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function plink(n){return "<a href='#/hrac/"+encodeURIComponent(n)+"'>"+esc(n)+"</a>"}

var P = {}, totalPot = 0;
TOURNAMENTS.forEach(function(t,i){
  var all = [].concat.apply([], t.results);
  t.id = i; t.n = all.length; t.pot = t.n * t.buyin; totalPot += t.pot;
  var place = 1;
  t.results.forEach(function(g,gi){
    g.forEach(function(p){
      var won = gi===0 ? t.pot/g.length : 0;
      var s = P[p] || (P[p] = {name:p, played:0, wins:0, won:0, spent:0, best:99, log:[]});
      s.played++; s.spent += t.buyin; s.won += won;
      if (gi===0) s.wins++;
      if (place < s.best) s.best = place;
      s.log.push({t:t, place:place, net:won-t.buyin});
    });
    place += g.length;
  });
});
var rows = Object.keys(P).map(function(k){var s=P[k]; s.net=s.won-s.spent; return s});
rows.sort(function(a,b){return b.wins-a.wins || b.net-a.net || a.best-b.best || a.name.localeCompare(b.name,"cs")});
rows.forEach(function(s,i){var q=rows[i-1]; s.rank=(i&&q.wins===s.wins&&q.net===s.net&&q.best===s.best)?q.rank:i+1});
var BUYIN = TOURNAMENTS.length ? TOURNAMENTS[TOURNAMENTS.length-1].buyin : 100;

function slot(s,cls){
  if(!s) return "<div class='slot "+cls+"'></div>";
  return "<a class='slot "+cls+"' href='#/hrac/"+encodeURIComponent(s.name)+"'><div class='pn'>"+esc(s.name)+"</div><div class='pm'>"+pl(s.wins,"výhra","výhry","výher")+"</div><div class='blk'>"+s.rank+"</div></a>";
}
function home(){
  if(!rows.length) return "<h1>Poker</h1><p class='empty'>Zatím žádné turnaje.</p>";
  return "<h1>Síň slávy</h1><p class='sub'>Vítěz bere vše. Vklad na turnaj "+kc(BUYIN)+".</p>"+
   "<div class='podium'>"+slot(rows[1],"s2")+slot(rows[0],"s1")+slot(rows[2],"s3")+"</div>"+
   "<div class='stats'><div><b>"+TOURNAMENTS.length+"</b><span>"+(TOURNAMENTS.length===1?"turnaj":(TOURNAMENTS.length<5?"turnaje":"turnajů"))+"</span></div>"+
   "<div><b>"+rows.length+"</b><span>"+(rows.length===1?"hráč":(rows.length<5?"hráči":"hráčů"))+"</span></div>"+
   "<div><b>"+kc(totalPot)+"</b><span>odehráno celkem</span></div></div>";
}
function tournaments(){
  var h = "<h1>Historie turnajů</h1><p class='sub'>Klikni na turnaj pro všechny detaily.</p><h2>Všechny turnaje</h2>";
  TOURNAMENTS.slice().reverse().forEach(function(t){
    h += "<a class='night' href='#/turnaj/"+t.id+"'><b>"+esc(dt(t.date))+"</b><span>"+pl(t.n,"hráč","hráči","hráčů")+", bank "+kc(t.pot)+". Vítěz: "+t.results[0].map(esc).join(" a ")+"</span></a>";
  });
  return h || "<p class='empty'>Zatím žádné turnaje.</p>";
}
function tournament(id){
  var t = TOURNAMENTS[id]; if(!t) return tournaments();
  var h = "<a class='back' href='#/turnaje'>← Všechny turnaje</a><h1>"+esc(dt(t.date))+"</h1>"+
   "<div class='grid'><div><b>"+t.n+"</b><span>hráčů</span></div><div><b>"+kc(t.buyin)+"</b><span>vklad</span></div><div><b>"+kc(t.pot)+"</b><span>bank</span></div></div>"+
   "<h2>Výsledky</h2><div class='wrap'><table><thead><tr><th>Místo</th><th>Hráč</th><th>Výsledek</th></tr></thead><tbody>";
  var place = 1;
  t.results.forEach(function(g,gi){
    g.forEach(function(p){
      var net = (gi===0 ? t.pot/g.length : 0) - t.buyin;
      h += "<tr><td"+(gi===0?" class='gold'":"")+">"+place+".</td><td>"+plink(p)+"</td><td class='"+cl(net)+"'>"+sg(net)+"</td></tr>";
    });
    place += g.length;
  });
  return h + "</tbody></table></div>";
}
function board(){
  var h = "<h1>Žebříček</h1><p class='sub'>Klikni na hráče pro jeho statistiky.</p><h2>Pořadí</h2><div class='wrap'><table><thead><tr><th>#</th><th>Hráč</th><th>Výhry</th><th>Odehráno</th><th>Vyhráno</th><th>Bilance</th></tr></thead><tbody>";
  rows.forEach(function(s){
    h += "<tr><td>"+s.rank+".</td><td>"+plink(s.name)+"</td><td"+(s.wins?" class='gold'":"")+">"+s.wins+"</td><td>"+s.played+"</td><td>"+kc(s.won)+"</td><td class='"+cl(s.net)+"'>"+sg(s.net)+"</td></tr>";
  });
  if(!rows.length) h += "<tr><td class='empty' colspan='6'>Zatím žádné turnaje.</td></tr>";
  return h + "</tbody></table></div><footer>Bilance = vyhráno minus vklady.</footer>";
}
function player(name){
  var s = P[name]; if(!s) return board();
  var h = "<a class='back' href='#/zebricek'>← Žebříček</a><h1>"+esc(s.name)+"</h1><p class='sub'>"+s.rank+". místo v žebříčku</p>"+
   "<div class='grid'>"+
   "<div><b>"+s.wins+"</b><span>výher</span></div>"+
   "<div><b>"+s.played+"</b><span>odehraných turnajů</span></div>"+
   "<div><b>"+s.best+". místo</b><span>nejlepší umístění</span></div>"+
   "<div><b>"+Math.round(100*s.wins/s.played)+" %</b><span>úspěšnost (výhry)</span></div>"+
   "<div><b>"+kc(s.won)+"</b><span>vyhráno celkem</span></div>"+
   "<div><b>"+kc(s.spent)+"</b><span>vsazeno celkem</span></div>"+
   "<div><b class='"+cl(s.net)+"'>"+sg(s.net)+"</b><span>celková bilance</span></div></div>"+
   "<h2>Turnaje hráče</h2><div class='wrap'><table><thead><tr><th>Datum</th><th>Turnaj</th><th>Místo</th><th>Výsledek</th></tr></thead><tbody>";
  s.log.slice().reverse().forEach(function(l){
    h += "<tr><td>"+esc(new Date(l.t.date+"T12:00:00").toLocaleDateString("cs-CZ"))+"</td><td><a href='#/turnaj/"+l.t.id+"'>Detail</a></td><td>"+l.place+".</td><td class='"+cl(l.net)+"'>"+sg(l.net)+"</td></tr>";
  });
  return h + "</tbody></table></div>";
}
// Hra 3x3 (samostatná hra, hráči se NEPOČÍTAJÍ do žebříčku). Obrázek hry nahraj na GitHub pod názvem 3x3.png (nebo 3x3.jpg).
var GAME_IMGS = ["3x3.png", "3x3.jpg"];
function imgNext(el){
  var n = +el.getAttribute("data-i") + 1;
  if (n < GAME_IMGS.length) { el.setAttribute("data-i", n); el.src = GAME_IMGS[n]; }
  else { el.parentNode.className = "shot noimg"; el.remove(); }
}
var GAME3 = [
  {name:"Mates", picks:["vylepšení Pošťáka Peta alkoholem","hydraulické kleště na klec","chromozom navíc pro Ondřeje"],
   note:"Extrémně silná kombinace. Má příběh, technické řešení problému (klec) i biologický upgrade. Velmi konzistentní chaos."},
  {name:"David", picks:["žížalací s mobilní kotelnou","Pošťák Pet","Braník 6× 2L"],
   note:"Mobilní kotelna + Braník multipack je silný český engineering vibe. Pošťák Pet navíc funguje jako univerzální meme spojka."},
  {name:"Vojta", picks:["Grenny","Piggy","zavření páva do klece"],
   note:"Páv v kleci je kvalitní payoff a navazuje na dění v koláži. Body za tematickou soudržnost."},
  {name:"Kuba", picks:["Jan Neruda","sraženky pro Pošťáka Peta","Heartsteel na džus"],
   note:"Velmi kulturně-literární vstup, ale proti alkoholizovanému Pošťákovi Petovi a mobilní kotelně je to těžký boj."},
  {name:"Kryštof", picks:["Mike Wazowski","Maxi pes Fík","Restaurace U Kašpárka"],
   note:"Solidní klasika, ale méně destruktivní energie než konkurence. Restaurace U Kašpárka je nicméně silný regionální partner."}
];
var RULES = [
  "Hrací plocha se skládá z 3 × 3 polí.",
  "Tato hra nemá žádná předem stanovená pravidla. Pravidla si hráči vymýšlejí za pochodu během hry.",
  "Hra končí ve chvíli, kdy hráče přestane bavit."
];
var SPONSORS = ["Papírny Brno","Restaurace U Kašpárka","SlinksClan","QuestHunt","Karbanátek s.r.o.","Sazka Loterie"];
function game(){
  var h = "<h1>3x3</h1><section class='res rules'><h3>Pravidla hry</h3><ol class='final'>"+RULES.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ol></section>"+
    "<figure class='shot'><img src='"+esc(GAME_IMGS[0])+"' data-i='0' alt='Obrázek hry 3x3' onerror='imgNext(this)'></figure>"+
    "<h2>Výsledky</h2>";
  GAME3.forEach(function(g,i){
    h += "<section class='res"+(i===0?" first":"")+"'><h3><span class='rk'>"+(i+1)+"</span>"+esc(g.name)+"</h3><ul class='picks'>"+
      g.picks.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul><p>"+esc(g.note)+"</p></section>";
  });
  h += "<h2>Konečné pořadí</h2><div class='res'><ol class='final'>"+GAME3.map(function(g){return "<li>"+esc(g.name)+"</li>"}).join("")+"</ol></div>"+
    "<h2>Poděkování sponzorům</h2><div class='res'><p>Tato soutěž by nebyla možná bez podpory:</p><ul class='thanks'>"+
    SPONSORS.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul></div>";
  return h;
}
function route(){
  var h = location.hash.replace(/^#\/?/,"").split("/"), v = h[0], a = h[1] ? decodeURIComponent(h[1]) : "";
  var html = v==="turnaje" ? tournaments() : v==="turnaj" ? tournament(+a) : v==="zebricek" ? board() : v==="3x3" ? game() : v==="hrac" ? player(a) : home();
  document.getElementById("app").innerHTML = html;
  var on = {turnaje:"n-tur", turnaj:"n-tur", zebricek:"n-zeb", hrac:"n-zeb", "3x3":"n-3x3"}[v] || "n-home";
  ["n-home","n-tur","n-zeb","n-3x3"].forEach(function(id){document.getElementById(id).className = id===on ? "on" : ""});
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
document.getElementById("splash").addEventListener("click", function(){
  var el = this;
  el.classList.add("out");
  setTimeout(function(){el.style.display="none"}, 750);
});
route();
</script>
</body>
</html>
